# Render blueprint for the Crane IFS dashboard. Runbook: docs/deploy-render.md.
#
# Three services and one database, mirroring compose.yaml without Metabase:
#   crane-ifs-web     nginx: the built front end, and /api/ proxied to the private API
#   crane-ifs-api     FastAPI, private (no public URL); migrations run before each deploy
#   crane-ifs-worker  the 60-second tick: nightly sync (02:30 America/Chicago), WinTeam timekeeping every
#                     30 minutes, PhotoValidation staffing requests every 15
#   crane-ifs-db      PostgreSQL 16, reachable only from these services
#
# Secrets are `sync: false` on the API, so Render asks for each one once when the blueprint is
# applied; the worker reads the same values from the API with fromService. (An environment group
# cannot hold `sync: false` or generated values, so the group carries only plain settings.)
# Nothing secret is a VITE_ variable; the browser only ever talks to /api/v1.

databases:
  - name: crane-ifs-db
    databaseName: facilities
    user: facilities_app
    plan: 0.5c-1g              # the mart rebuild is analytical SQL over ~0.5 GB; 256 MB of RAM is tight
    diskSizeGB: 5              # the local database is ~0.5 GB with every raw WinTeam payload
    postgresMajorVersion: "16" # matches compose.yaml, so a local dump restores cleanly
    ipAllowList: []            # private network only; add your IP briefly for the one-time restore

envVarGroups:
  - name: crane-ifs-settings
    envVars:
      # WinTeam: read-only GETs on the documented endpoints. The resource list leaves out
      # job_schedules and ap_payments, which this tenant is not entitled to (HTTP 403).
      - key: WINTEAM_ENABLED
        value: "true"
      - key: WINTEAM_RESOURCES
        value: jobs,vendors,timekeeping,job_budgets,ap_invoices,ap_invoice_details,ar_invoices
      - key: WINTEAM_SARUS_ENABLED
        value: "true"
      # Worker intervals in minutes (0 = off).
      - key: WINTEAM_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: PV_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: LOG_LEVEL
        value: INFO

services:
  - type: pserv
    name: crane-ifs-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    branch: main
    autoDeploy: true
    preDeployCommand: python -m app.migrate
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: crane-ifs-db
          property: connectionString
      - fromGroup: crane-ifs-settings
      # Sign-in (docs/auth-rbac.md). The API refuses to start without a session secret.
      - key: APP_AUTH_MODE
        value: required
      - key: APP_SESSION_SECRET
        generateValue: true
      # The first administrator is created on the sign-in page with this code (Render > crane-ifs-api >
      # Environment); after that, users are managed in Admin > Users.
      - key: APP_SETUP_TOKEN
        generateValue: true
      # Optional environment users (a way back in); leave empty.
      - key: APP_USERS_JSON
        sync: false
      - key: INGESTION_ADMIN_TOKEN
        generateValue: true
      # WINTEAM_ENABLED and WINTEAM_SARUS_ENABLED are true, so the API will not start without the
      # base URLs and tenant ids. Relay stays empty until its dashboard export is deployed.
      - key: WINTEAM_BASE_URL
        sync: false
      - key: WINTEAM_TENANT_ID
        sync: false
      - key: WINTEAM_SUBSCRIPTION_KEY
        sync: false
      - key: WINTEAM_CUSTOMER_NUMBERS
        sync: false
      - key: WINTEAM_SARUS_BASE_URL
        sync: false
      - key: WINTEAM_SARUS_TENANT_ID
        sync: false
      - key: WINTEAM_SARUS_SUBSCRIPTION_KEY
        sync: false
      - key: RELAY_BASE_URL
        sync: false
      - key: RELAY_EXPORT_TOKEN
        sync: false
      - key: PHOTOVALIDATION_API_URL
        sync: false
      - key: PHOTOVALIDATION_API_TOKEN
        sync: false
      - key: COMPANYCAM_API_TOKEN
        sync: false

  - type: worker
    name: crane-ifs-worker
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    branch: main
    autoDeploy: true
    dockerCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crane-ifs-db
          property: connectionString
      - fromGroup: crane-ifs-settings
      - key: WINTEAM_BASE_URL
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: WINTEAM_BASE_URL
      - key: WINTEAM_TENANT_ID
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: WINTEAM_TENANT_ID
      - key: WINTEAM_SUBSCRIPTION_KEY
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: WINTEAM_SUBSCRIPTION_KEY
      - key: WINTEAM_CUSTOMER_NUMBERS
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: WINTEAM_CUSTOMER_NUMBERS
      - key: WINTEAM_SARUS_BASE_URL
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: WINTEAM_SARUS_BASE_URL
      - key: WINTEAM_SARUS_TENANT_ID
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: WINTEAM_SARUS_TENANT_ID
      - key: WINTEAM_SARUS_SUBSCRIPTION_KEY
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: WINTEAM_SARUS_SUBSCRIPTION_KEY
      - key: RELAY_BASE_URL
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: RELAY_BASE_URL
      - key: RELAY_EXPORT_TOKEN
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: RELAY_EXPORT_TOKEN
      - key: PHOTOVALIDATION_API_URL
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: PHOTOVALIDATION_API_URL
      - key: PHOTOVALIDATION_API_TOKEN
        fromService:
          type: pserv
          name: crane-ifs-api
          envVarKey: PHOTOVALIDATION_API_TOKEN

  - type: web
    name: crane-ifs-web
    runtime: docker
    dockerfilePath: ./docker/web/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: crane-ifs-api
          property: hostport
